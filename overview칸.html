<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S-build / Splant</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #f4f7fb;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --nav: #111827;
    }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    button { font: inherit; cursor: pointer; border: 0; }
    .hidden { display: none !important; }

    header {
      height: 68px;
      padding: 0 28px;
      background: var(--nav);
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-brand { font-size: 20px; font-weight: 900; }
    .header-sub { font-size: 13px; color: #cbd5e1; margin-left: 10px; font-weight: 600; }
    .header-left { display: flex; align-items: center; min-width: 0; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .header-btn {
      background: #374151;
      color: white;
      padding: 9px 13px;
      border-radius: 8px;
      font-weight: 750;
    }
    .header-btn:hover { background: #4b5563; }

    main {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      padding: 28px 30px 22px;
    }
    .page-title { margin: 0 0 6px; font-size: 28px; font-weight: 900; letter-spacing: -.03em; }
    .page-desc { margin: 0 0 20px; color: var(--muted); line-height: 1.6; }

    .tag-board-wrap {
      width: 100%;
      height: var(--tag-board-height, calc(100vh - 175px));
      min-height: 340px;
      overflow: hidden;
    }
    .tag-board {
      display: grid;
      grid-template-columns: repeat(var(--tag-board-cols, 4), minmax(0, 1fr));
      grid-template-rows: repeat(var(--tag-board-rows, 2), minmax(0, 1fr));
      gap: var(--tag-board-gap, 18px);
      padding: 8px;
      width: 100%;
      height: 100%;
      overflow: hidden;
      align-items: stretch;
    }
    .tag-column {
      background: #748196;
      border-radius: clamp(9px, 1vw, 14px);
      min-width: 0;
      min-height: 0;
      height: 100%;
      padding: var(--tag-card-padding, 14px);
      color: white;
      box-shadow: 0 5px 18px rgba(15, 23, 42, .08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .tag-column:not(.expanded) { justify-content: center; align-items: center; }
    .tag-column:not(.expanded) .tag-column-title { width: 100%; justify-content: center; text-align: center; }
    .tag-column:not(.expanded) .tag-column-title-left { width: 100%; text-align: center; overflow: visible; }
    .tag-column:not(.expanded) .tag-column-name {
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag-column:not(.expanded) .tag-column-count { text-align: center; margin-top: 8px; }
    .tag-column:not(.expanded) .tag-toggle {
      position: absolute;
      top: var(--tag-card-padding, 14px);
      right: var(--tag-card-padding, 14px);
    }
    .tag-column.expanded .tag-column-title {
      justify-content: center;
      text-align: center;
      position: relative;
      padding-right: calc(var(--tag-toggle-size, 30px) + 10px);
      padding-left: calc(var(--tag-toggle-size, 30px) + 10px);
    }
    .tag-column.expanded .tag-column-title-left { text-align: center; }
    .tag-column.expanded .tag-column-name { white-space: normal; }
    .tag-column.expanded .tag-toggle {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
    }
    .tag-column-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: var(--tag-title-size, clamp(16px, 1.6vw, 24px));
      font-weight: 900;
      letter-spacing: -.03em;
      margin: 0;
      cursor: pointer;
      user-select: none;
    }
    .tag-column-title-left { min-width: 0; overflow: hidden; }
    .tag-column-name { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tag-column-count {
      display: block;
      margin-top: 4px;
      font-size: var(--tag-count-size, 11px);
      font-weight: 700;
      color: rgba(255,255,255,.72);
    }
    .tag-toggle {
      flex: 0 0 auto;
      width: var(--tag-toggle-size, 30px);
      height: var(--tag-toggle-size, 30px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: rgba(255,255,255,.12);
      color: white;
      font-size: 13px;
      transition: .15s ease;
    }
    .tag-column-title:hover .tag-toggle { background: rgba(255,255,255,.2); }
    .priority-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: 2px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #fff7ed;
      color: #c2410c;
      font-size: 11px;
      font-weight: 800;
      vertical-align: middle;
    }
    .tag-report-list {
      margin-top: 8px;
      padding-top: 8px;
      padding-right: 4px;
      border-top: 1px solid rgba(255,255,255,.22);
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.38) rgba(255,255,255,.08);
    }
    .tag-report-list::-webkit-scrollbar { width: 7px; }
    .tag-report-list::-webkit-scrollbar-track { background: rgba(255,255,255,.08); border-radius: 999px; }
    .tag-report-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.38); border-radius: 999px; }
    .tag-report-list::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.55); }
    .tag-report-mini {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      padding: 11px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: .15s ease;
    }
    .tag-report-mini:last-child { margin-bottom: 0; }
    .tag-report-mini:hover { background: rgba(255,255,255,.15); transform: translateY(-1px); }
    .tag-report-author { font-size: 13px; font-weight: 800; margin-bottom: 3px; }
    .tag-report-date { font-size: 11px; color: rgba(255,255,255,.72); margin-bottom: 5px; }
    .tag-report-title { font-size: 12px; line-height: 1.4; font-weight: 650; color: white; }
    .tag-column-empty { padding: 10px 2px; color: rgba(255,255,255,.62); font-size: 12px; text-align: center; }

    .empty {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 44px;
      color: #9ca3af;
      background: white;
      border-radius: 14px;
      border: 1px dashed #d1d5db;
    }

    .report-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.52);
      z-index: 2500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .report-modal-card {
      width: min(760px, 100%);
      max-height: 86vh;
      overflow: auto;
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 25px 70px rgba(0,0,0,.22);
    }
    .report-modal-head { display: flex; justify-content: space-between; gap: 15px; align-items: flex-start; margin-bottom: 12px; }
    .report-modal-close { background: #e5e7eb; color: #374151; border-radius: 9px; padding: 8px 11px; }
    .report-title { font-size: 20px; font-weight: 900; }
    .report-meta { color: var(--muted); font-size: 13px; margin-top: 6px; line-height: 1.6; }
    .report-body { color: #374151; line-height: 1.75; margin: 18px 0; overflow-wrap: anywhere; }
    .report-body p { margin: .45em 0; }
    .report-body ul, .report-body ol { padding-left: 26px; }
    .report-tags { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag-chip {
      display: inline-flex;
      align-items: center;
      background: #dbeafe;
      color: #1d4ed8;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }
    .attachment-box { margin-top: 14px; padding: 13px 14px; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 12px; }
    .attachment-title { font-size: 12px; font-weight: 800; color: var(--muted); margin-bottom: 8px; }
    .attachment-item { padding: 7px 0; border-top: 1px solid #e5e7eb; }
    .attachment-item:first-of-type { border-top: 0; padding-top: 0; }
    .attachment-link { color: var(--primary); font-weight: 800; text-decoration: none; }

    .status-toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 3000;
      background: #111827;
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: .2s ease;
    }
    .status-toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 900px) {
      main { padding: 22px 16px 16px; }
      header { padding: 0 16px; }
      .header-sub { display: none; }
      .tag-board { gap: 10px; }
      .tag-column { padding: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="header-brand">S-build / Splant</div>
    </div>
    <div class="header-actions">
      <button class="header-btn" onclick="reloadBoard()">새로고침</button>
    </div>
  </header>

  <main>
    <div class="tag-board-wrap">
      <div id="tagBoard" class="tag-board"></div>
    </div>
  </main>

  <div id="toast" class="status-toast"></div>

  <script>
    const DEFAULT_TAGS = ["연구사업부","생산부","영업부","진행중","완료","미완료","긴급","대표확인"];

    let reports = [];
    let tags = [];
    let tagPriorities = {};

    function loadData() {
      reports = safeJsonParse(localStorage.getItem("rh_reports"), []);
      tags = safeJsonParse(localStorage.getItem("rh_tags"), null) || [...DEFAULT_TAGS];
      tagPriorities = safeJsonParse(localStorage.getItem("rh_tag_priorities"), {}) || {};
      tags.forEach(tag => {
        if (typeof tagPriorities[tag] !== "number") tagPriorities[tag] = 0;
      });
    }

    function safeJsonParse(value, fallback) {
      try { return value ? JSON.parse(value) : fallback; }
      catch { return fallback; }
    }

    function renderTagBoardColumns() {
      const board = document.getElementById("tagBoard");
      if (!board) return;
      board.innerHTML = "";

      if (!tags.length) {
        board.innerHTML = `<div class="empty">등록된 태그가 없습니다.</div>`;
        return;
      }

      const reportCountByTag = {};
      tags.forEach(tag => {
        reportCountByTag[tag] = reports.filter(report => (report.tags || []).includes(tag)).length;
      });

      const sortedTags = [...tags].sort((a, b) => {
        const pa = Number(tagPriorities[a] || 0);
        const pb = Number(tagPriorities[b] || 0);
        if (pb !== pa) return pb - pa;

        const countDiff = Number(reportCountByTag[b] || 0) - Number(reportCountByTag[a] || 0);
        if (countDiff !== 0) return countDiff;

        return tags.indexOf(a) - tags.indexOf(b);
      });

      const wrap = board.closest(".tag-board-wrap");
      const tagCount = sortedTags.length;
      const viewportWidth = Math.max(320, window.innerWidth || 1200);
      const viewportHeight = Math.max(480, window.innerHeight || 800);

      if (wrap) {
        const top = wrap.getBoundingClientRect().top;
        const availableHeight = Math.max(300, viewportHeight - top - 18);
        wrap.style.setProperty("--tag-board-height", availableHeight + "px");
      }

      const boardWidth = Math.max(280, board.clientWidth || viewportWidth);
      const boardHeight = Math.max(300, wrap ? wrap.clientHeight : viewportHeight * 0.72);

      let bestCols = 1;
      let bestRows = tagCount;
      let bestScore = Infinity;

      for (let cols = 1; cols <= tagCount; cols++) {
        const rows = Math.ceil(tagCount / cols);
        const cellAspect = (boardWidth / cols) / (boardHeight / rows);
        const emptyCells = cols * rows - tagCount;
        const targetCellAspect = viewportWidth < 640 ? 1.25 : 1.45;
        const score = Math.abs(Math.log(cellAspect / targetCellAspect)) + emptyCells * 0.12;
        if (score < bestScore) {
          bestScore = score;
          bestCols = cols;
          bestRows = rows;
        }
      }

      if (viewportWidth < 560) bestCols = Math.min(bestCols, 3);
      bestRows = Math.ceil(tagCount / bestCols);

      const density = Math.max(bestCols, bestRows);
      const gap = density >= 6 ? 10 : density >= 4 ? 14 : 18;
      const padding = density >= 7 ? 7 : density >= 5 ? 9 : density >= 4 ? 11 : 14;
      const titleSize = density >= 7 ? 12 : density >= 6 ? 13 : density >= 5 ? 14 : density >= 4 ? 16 : 20;
      const countSize = density >= 6 ? 9 : 10;
      const toggleSize = density >= 6 ? 23 : density >= 4 ? 26 : 30;

      board.style.setProperty("--tag-board-cols", bestCols);
      board.style.setProperty("--tag-board-rows", bestRows);
      board.style.setProperty("--tag-board-gap", gap + "px");
      board.style.setProperty("--tag-card-padding", padding + "px");
      board.style.setProperty("--tag-title-size", titleSize + "px");
      board.style.setProperty("--tag-count-size", countSize + "px");
      board.style.setProperty("--tag-toggle-size", toggleSize + "px");

      sortedTags.forEach(tag => {
        const taggedReports = reports
          .filter(report => (report.tags || []).includes(tag))
          .sort((a, b) => Number(b.id || 0) - Number(a.id || 0));

        const column = document.createElement("section");
        column.className = "tag-column";

        const heading = document.createElement("div");
        heading.className = "tag-column-title";

        const priority = Number(tagPriorities[tag] || 0);
        const priorityLabel = priority >= 3 ? "최우선" : priority === 2 ? "높음" : priority === 1 ? "보통" : "기본";

        const left = document.createElement("div");
        left.className = "tag-column-title-left";
        left.innerHTML = `
          <span class="tag-column-name">#${escapeHtml(tag)} ${priority > 0 ? `<span class="priority-badge">★ ${priorityLabel}</span>` : ""}</span>
          <span class="tag-column-count">${taggedReports.length}개의 보고서</span>
        `;

        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "tag-toggle";
        toggle.textContent = "＋";
        toggle.title = "보고서 펼치기";

        heading.appendChild(left);
        heading.appendChild(toggle);
        column.appendChild(heading);

        const reportList = document.createElement("div");
        reportList.className = "tag-report-list hidden";

        if (!taggedReports.length) {
          const empty = document.createElement("div");
          empty.className = "tag-column-empty";
          empty.textContent = "이 태그로 등록된 보고서가 없습니다.";
          reportList.appendChild(empty);
        } else {
          taggedReports.forEach(report => {
            const mini = document.createElement("div");
            mini.className = "tag-report-mini";
            mini.onclick = event => {
              event.stopPropagation();
              openBoardReportDetail(report.id);
            };

            const author = document.createElement("div");
            author.className = "tag-report-author";
            author.textContent = report.authorName || "이름 없음";

            const date = document.createElement("div");
            date.className = "tag-report-date";
            date.textContent = formatBoardReportDate(report);

            const title = document.createElement("div");
            title.className = "tag-report-title";
            title.textContent = report.title || "제목 없음";

            mini.appendChild(author);
            mini.appendChild(date);
            mini.appendChild(title);
            reportList.appendChild(mini);
          });
        }

        heading.onclick = () => {
          const isHidden = reportList.classList.toggle("hidden");
          column.classList.toggle("expanded", !isHidden);
          toggle.textContent = isHidden ? "＋" : "−";
          toggle.title = isHidden ? "보고서 펼치기" : "보고서 접기";
        };

        toggle.onclick = event => {
          event.stopPropagation();
          heading.click();
        };

        column.appendChild(reportList);
        board.appendChild(column);
      });
    }

    function formatBoardReportDate(report) {
      if (report.createdDate) return String(report.createdDate).replaceAll("-", ".");

      const raw = String(report.createdAt || "");
      const nums = raw.match(/\d+/g);
      if (nums && nums.length >= 3) {
        return `${nums[0]}.${String(nums[1]).padStart(2,"0")}.${String(nums[2]).padStart(2,"0")}`;
      }
      return raw || "-";
    }

    function openBoardReportDetail(reportId) {
      const report = reports.find(r => String(r.id) === String(reportId));
      if (!report) return;

      const backdrop = document.createElement("div");
      backdrop.className = "report-modal-backdrop";
      backdrop.id = "boardReportModal";

      const tagHtml = (report.tags || []).map(tag => `<span class="tag-chip">#${escapeHtml(tag)}</span>`).join("");
      const contentHtml = getReportContentHtml(report);
      const filesHtml = attachmentHtml(report);

      backdrop.innerHTML = `
        <div class="report-modal-card" onclick="event.stopPropagation()">
          <div class="report-modal-head">
            <div>
              <div class="report-title">${escapeHtml(report.title || "제목 없음")}</div>
              <div class="report-meta">작성자: ${escapeHtml(report.authorName || "이름 없음")} · 등록일: ${escapeHtml(report.createdAt || "-")}</div>
            </div>
            <button class="report-modal-close" onclick="closeBoardReportDetail()">✕</button>
          </div>
          <div class="report-body">${contentHtml}</div>
          ${filesHtml}
          <div class="report-tags">${tagHtml}</div>
        </div>
      `;

      backdrop.onclick = closeBoardReportDetail;
      document.body.appendChild(backdrop);
    }

    function closeBoardReportDetail() {
      const modal = document.getElementById("boardReportModal");
      if (modal) modal.remove();
    }

    function getReportContentHtml(report) {
      if (report && typeof report.contentHtml === "string" && report.contentHtml.trim()) {
        return sanitizeDisplayHtml(report.contentHtml);
      }
      return escapeHtml(report && report.content ? report.content : "").replaceAll("\n", "<br>");
    }

    function sanitizeDisplayHtml(html) {
      const template = document.createElement("template");
      template.innerHTML = String(html || "");
      template.content.querySelectorAll("script,iframe,object,embed,link,meta,style").forEach(el => el.remove());
      template.content.querySelectorAll("*").forEach(el => {
        [...el.attributes].forEach(attr => {
          const name = attr.name.toLowerCase();
          const value = attr.value.trim().toLowerCase();
          if (name.startsWith("on") || (name === "href" && value.startsWith("javascript:")) || (name === "src" && value.startsWith("javascript:"))) {
            el.removeAttribute(attr.name);
          }
        });
      });
      return template.innerHTML;
    }

    function attachmentHtml(report) {
      const files = Array.isArray(report.attachments) ? report.attachments : [];
      if (!files.length) return "";

      const items = files.map(file => {
        const name = escapeHtml(file.name || "첨부파일");
        const url = typeof file.dataUrl === "string" ? file.dataUrl : "";
        if (!url) return `<div class="attachment-item">${name}</div>`;
        return `<div class="attachment-item"><a class="attachment-link" href="${escapeHtml(url)}" target="_blank" rel="noopener">📎 ${name}</a></div>`;
      }).join("");

      return `<div class="attachment-box"><div class="attachment-title">첨부파일</div>${items}</div>`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function reloadBoard(showMessage = true) {
      loadData();
      renderTagBoardColumns();
      if (showMessage) showToast("태그와 보고서 데이터를 새로 불러왔습니다.");
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(renderTagBoardColumns, 80);
    });

    window.addEventListener("storage", event => {
      if (["rh_reports", "rh_tags", "rh_tag_priorities"].includes(event.key)) {
        reloadBoard(false);
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeBoardReportDetail();
    });

    loadData();
    requestAnimationFrame(renderTagBoardColumns);
  </script>
</body>
</html>
